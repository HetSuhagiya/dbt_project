models:
  - name: stg_olist__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_olist__products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_olist__order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id